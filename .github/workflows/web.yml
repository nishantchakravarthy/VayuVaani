# Web version of VayuVaani: works on any phone, tablet or computer, and installs to the home screen.
# Every hour it makes a fresh forecast with the ready-made model and publishes it to GitHub Pages.
#
# One-time setup on GitHub (repository Settings):
#   1. Secrets and variables > Actions > New repository secret:
#        OPENAQ_API_KEY  (required)    FIRMS_MAP_KEY  (optional, adds fire data)
#   2. Pages > Build and deployment > Source: GitHub Actions
# The site then appears at https://<your-username>.github.io/VayuVaani/
name: Web version

on:
  schedule:
    - cron: "17 * * * *"      # every hour
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths: ["src/**", "prebuilt/**", "config/**", ".github/workflows/web.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install numpy==2.1.3 scipy==1.14.1 pandas==2.2.3 scikit-learn==1.5.2 lightgbm==4.5.0 requests python-dotenv joblib openpyxl
          pip install --no-deps -e .
      - name: Check the key is set
        run: |
          if [ -z "$OPENAQ_API_KEY" ]; then echo "::error::Add the OPENAQ_API_KEY secret in Settings > Secrets and variables > Actions"; exit 1; fi
      - name: Forecast and build the site
        run: python -m vayuvaani.web site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
